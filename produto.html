<header class="site-header">
  <a href="index.html">Vitrine</a>
</header>

<main id="produto"></main>

<script src="assets/js/products.js"></script>
<script src="assets/js/analytics.js"></script>
<script>
  function svgShopee() {
    return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<path d="M6 2 4 6v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6l-2-4H6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<path d="M4 6h16" stroke="currentColor" stroke-width="1.6"/>' +
      '<path d="M8.5 10a3.5 3.5 0 0 0 7 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
      '</svg>';
  }

  function midiaHTML(midia, nome) {
    if (midia.tipo === "video") {
      return '<video src="' + midia.src + '" autoplay muted loop playsinline controls aria-label="' + nome + '"></video>';
    }
    return '<img src="' + midia.src + '" alt="' + nome + '">';
  }

  function renderProduto() {
    var container = document.getElementById("produto");
    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");
    var produtos = window.PRODUTOS || [];
    var produto = produtos.find(function (p) { return p.id === id; });

    if (!produto) {
      container.innerHTML = '<p class="produto-erro">Produto não encontrado. <a href="index.html">Voltar para a vitrine</a>.</p>';
      return;
    }

    document.title = produto.nome;

    container.innerHTML =
      '<div class="produto">' +
        '<div class="produto-midia">' + midiaHTML(produto.midia, produto.nome) + '</div>' +
        '<div class="produto-info">' +
          '<h1 class="produto-nome">' + produto.nome + '</h1>' +
          (produto.preco ? '<p class="produto-preco">' + produto.preco + '</p>' : '') +
          '<a class="btn-shopee" href="' + produto.shopeeUrl + '" target="_blank" rel="noopener sponsored" id="btn-shopee">' +
            svgShopee() + ' Ver na Shopee' +
          '</a>' +
        '</div>' +
      '</div>';

    document.getElementById("btn-shopee").addEventListener("click", function () {
      trackShopeeClick(produto);
    });
  }

  renderProduto();
</script>
</body>
</html>
