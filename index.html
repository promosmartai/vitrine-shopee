<header class="site-header">
  <a href="index.html">Vitrine</a>
</header>

<main id="vitrine" class="vitrine" aria-live="polite"></main>

<script src="assets/js/products.js"></script>
<script src="assets/js/analytics.js"></script>
<script>
  function svgShopee() {
    return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<path d="M6 2 4 6v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6l-2-4H6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<path d="M4 6h16" stroke="currentColor" stroke-width="1.6"/>' +
      '<path d="M8.5 10a3.5 3.5 0 0 0 7 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
      '</svg>';
  }

  function midiaHTML(midia, nome) {
    if (midia.tipo === "video") {
      return '<video src="' + midia.src + '" autoplay muted loop playsinline aria-label="' + nome + '"></video>';
    }
    return '<img src="' + midia.src + '" alt="' + nome + '" loading="lazy">';
  }

  function renderVitrine() {
    var container = document.getElementById("vitrine");
    var produtos = window.PRODUTOS || [];

    if (produtos.length === 0) {
      container.innerHTML = '<p class="vitrine-vazia">Nenhum produto cadastrado ainda.</p>';
      return;
    }

    container.innerHTML = produtos.map(function (p) {
      return (
        '<article class="card">' +
          '<a class="card-midia" href="produto.html?id=' + encodeURIComponent(p.id) + '">' +
            midiaHTML(p.midia, p.nome) +
          '</a>' +
          '<div class="card-info">' +
            '<h2 class="card-nome">' + p.nome + '</h2>' +
            (p.preco ? '<p class="card-preco">' + p.preco + '</p>' : '') +
            '<a class="btn-shopee" href="' + p.shopeeUrl + '" target="_blank" rel="noopener sponsored" data-produto-id="' + p.id + '">' +
              svgShopee() + ' Ver na Shopee' +
            '</a>' +
          '</div>' +
        '</article>'
      );
    }).join("");

    container.querySelectorAll(".btn-shopee").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var produto = produtos.find(function (p) { return p.id === btn.dataset.produtoId; });
        if (produto) trackShopeeClick(produto);
      });
    });
  }

  renderVitrine();
</script>
</body>
</html>
