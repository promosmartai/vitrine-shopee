<header class="py-5 text-center bg-white border-bottom">
  <div class="container">
    <h1 class="fw-bold">Produtos selecionados</h1>
    <p class="text-secondary mb-0">Veja de perto e compre direto na Shopee.</p>
  </div>
</header>

<main class="container py-5">
  <div class="row g-4">

    <!-- ============================================================
         UM PRODUTO = UM BLOCO ".col" ABAIXO.
         Para adicionar um produto novo: copie um bloco inteiro
         (do <div class="col..."> até o </div> que fecha ele),
         cole depois do último, e edite:
           - a imagem/vídeo (src e alt)
           - o link href para produto-SEU-PRODUTO.html
           - o nome e o preço
           - o link da Shopee no botão
           - os dois valores do onclick="trackShopeeClick(...)"
         Para remover um produto, apague o bloco inteiro.
    ============================================================= -->

    <div class="col-6 col-md-4 col-lg-3">
      <div class="card produto-card h-100">
        <a href="pages/produtos/processador-triturador-manual/">
          <img src="assets/img/processador-triturador-manual/processador-triturador-manual-01.webp" class="card-img-top" alt="Processador Triturador Manual de Alimentos Alho Legumes Frutas 500ml – 3 Lâminas Portátil">
        </a>
        <div class="card-body d-flex flex-column">
          <h2 class="card-title">Processador Triturador Manual de Alimentos Alho Legumes Frutas 500ml – 3 Lâminas Portátil</h2>
          <a class="btn btn-shopee mt-auto"
             href="https://s.shopee.com.br/5q7oppgxdj"
             target="_blank" rel="noopener sponsored"
             onclick="trackShopeeClick('processador-triturador-manual-500ml', 'Processador Triturador Manual de Alimentos Alho Legumes Frutas 500ml – 3 Lâminas Portátil')">
            <i class="bi bi-bag-check"></i> Ver na Shopee
          </a>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-lg-3">
      <div class="card produto-card h-100">
        <a href="pages/produtos/organizadores-de-geladeira/">
          <img src="assets/img/organizadores-de-geladeira/organizadores-de-geladeira-01.webp" class="card-img-top" alt="Organizadores De Geladeira Clear Com Tampa E Cesto Drenagem">
        </a>
        <div class="card-body d-flex flex-column">
          <h2 class="card-title">Organizadores De Geladeira Clear Com Tampa E Cesto Drenagem</h2>
          <a class="btn btn-shopee mt-auto"
             href="https://s.shopee.com.br/5LBbMDhAu3"
             target="_blank" rel="noopener sponsored"
             onclick="trackShopeeClick('organizadores-de-geladeira-clear', 'Organizadores De Geladeira Clear Com Tampa E Cesto Drenagem')">
            <i class="bi bi-bag-check"></i> Ver na Shopee
          </a>
        </div>
      </div>
    </div>

  </div>
